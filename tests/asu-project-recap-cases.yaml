version: 0.1
name: asu-project-recap-cases
purpose: >-
  Manual forward-evaluation fixtures for the /asu project-landing reference.
  They are not a CI gate and do not call a model automatically.

evaluation:
  mode: manual_forward
  automated: false
  runner: null

cases:
  - id: production-with-two-turn-rewrite
    mode: asu_project_landing_recap
    conversation:
      - turn: 1
        role: user
        content: |
          我在内部 Agent 工作台的生产环境负责执行前准备链路。
          原来线程、上传文件和 Sandbox 初始化分别由不同入口触发，
          偶尔会出现 Agent 已开始执行但运行环境还没准备好的失败。
          我把它们收敛成一个 Runtime Ready Preflight，按线程上下文、文件清单、
          Sandbox 就绪的顺序检查，再允许 Agent 执行；Sandbox 服务由基础设施团队维护。
          项目代号是 NOVA-DEMO，测试字段是 sk-example-redacted，客户标识是 client-demo-01。
          该链路已在内部生产环境运行两周，日志显示执行前失败率从 8.4% 降到 2.1%。
        expected:
          delivery_stage: 生产落地
          evidence_label: 实测结果
          required_sections:
            - 问题背景
            - 方案决策
            - 个人动作
            - 交付状态
            - 落地范围
            - 效果证据
            - 个人边界
            - 待补证据
            - 面试追问与回答准备
          required_boundaries:
            - 内部生产环境
            - 两周观察期
            - 基础设施团队维护 Sandbox 服务
          must_not:
            - 输出 NOVA-DEMO、sk-example-redacted 或 client-demo-01
            - 扩展为全量客户上线或整体业务收益
            - 把 Sandbox 服务写成用户个人完成
          optional_appendix:
            - 候选简历表述
            - 升维迁移
      - turn: 2
        role: user
        content: |
          我的尝试是：我把 Agent 执行前的多个准备步骤收敛成有序的就绪门，
          让上下文、文件和运行环境完成检查后再放行，内部生产日志显示失败率下降。
        expected:
          feedback_only:
            - 正确保留的事实
            - 已成立的升维动作
            - 证据或个人边界缺口
          must_not:
            - 重新输出完整九段复盘
            - 自动启动 /asu-study 或 L3/L2/L1 状态

  - id: internal-pilot-limited-scope
    mode: asu_project_landing_recap
    input: |
      我把一个 Agent 执行前的上下文和文件检查流程接入了测试租户，
      由 8 名内部同事试用了 10 个工作日。
      试点期间，准备阶段超时率从 11% 降到 6%，但还没有进入正式生产，
      也没有证据说明所有用户都会获得同样收益。
      我负责检查顺序和失败提示；底层 Sandbox 能力由平台团队提供。
      项目文档中有内部路径 C:\corp\pilot\agent-bootstrap 和邮箱 pilot-owner@example.invalid。
    expected:
      delivery_stage: 内部试点
      evidence_label: 阶段结果
      required_sections:
        - 面试追问与回答准备
      required_scope:
        - 测试租户
        - 8 名内部同事
        - 10 个工作日
      must_not:
        - 写成全面生产上线
        - 写成全产品长期指标
        - 输出 C:\corp\pilot\agent-bootstrap 或 pilot-owner@example.invalid
        - 把平台团队的 Sandbox 能力写成个人独立完成
      optional_appendix:
        - 候选简历表述
        - 升维迁移

  - id: prototype-with-projection
    mode: asu_project_landing_recap
    input: |
      我做了一个本地 Demo，把线程摘要、上传文件索引和 Sandbox 配置拼成
      Agent 执行前的初始化流程，在 20 条合成样例上有 17 条成功通过检查。
      目前没有接入生产，也没有真实用户；根据这组样例，我估计如果以后接入生产，
      准备阶段耗时可能下降约 30%，但这个数字还没有验证。
      我主要负责流程编排和样例验证，底层模型能力来自现有平台。
    expected:
      delivery_stage: 原型/技术验证
      evidence_labels:
        - 技术验证
        - 估算收益
      required_sections:
        - 面试追问与回答准备
      required_boundaries:
        - 本地 Demo
        - 20 条合成样例
        - 17 条通过检查
        - 没有生产接入和真实用户
      must_not:
        - 把 17/20 写成真实业务指标
        - 把约 30% 写成已实现收益
        - 把现有平台的模型能力写成个人训练或构建
      optional_appendix:
        - 候选简历表述
        - 升维迁移
