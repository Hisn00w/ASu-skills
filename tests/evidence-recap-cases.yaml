# /evidence-recap 脱敏行为契约用例
#
# 本文件用于人工前向评估与后续自动化接入准备。
# 当前不调用模型，也不作为确定性 CI 门禁。
# 所有项目名、数据、令牌和身份均为虚构或已泛化。

cases:
  - id: production-with-evidence-and-learning
    expected: evidence-recap
    delivery_stage: 生产落地
    conversation:
      - role: 用户
        content: |
          请复盘我参与的“星河工作台”上线。它在一个内部生产环境运行了两周，
          日志显示准备链路平均耗时从 8.4 分钟降到 2.1 分钟，异常率从 6.2%
          降到 2.0%。我负责梳理失败样本、设计分层检查、协调接入和上线后的
          日志核对。底层沙箱由平台团队提供。请不要输出内部路径、客户标识或
          令牌。复盘后默认给我一段升维迁移；如果适合求职，再给候选简历表述。
      - role: 用户
        content: |
          我的重写尝试是：“我独立开发了星河工作台，把所有客户的准备时间降低了
          75%，并负责了完整平台架构。”请只评价这段尝试，不要重新代写整篇复盘。
    required_sections:
      - 问题背景
      - 方案决策
      - 个人动作
      - 交付状态
      - 落地范围
      - 效果证据
      - 个人边界
      - 待补证据
      - 面试追问
      - 升维迁移
    optional_outputs:
      - 候选简历表述：仅在用户明确要求求职、简历或表达包装时追加
    expected_behavior:
      - 明确这是内部生产环境，不扩写为全量客户上线
      - 保留实测耗时和异常率，并标注为日志实测结果
      - 将用户负责的梳理、设计、协调和核对与平台团队的沙箱能力分开
      - 识别“所有客户”“独立开发”“完整平台架构”属于范围或责任越界
      - 对用户重写只反馈事实保留、升维动作成立点和证据或责任边界缺口
      - 默认提供事实、机制、影响之间的升维迁移，不强制继续练习
      - 不输出内部路径、客户标识或令牌
    must_not:
      - 把团队交付改写成用户个人独立完成
      - 把内部生产环境改写成面向所有客户的公开上线
      - 把复盘反馈重新扩写成完整答案

  - id: pilot-with-limited-scope
    expected: evidence-recap
    delivery_stage: 内部试点
    prompt: |
      请复盘“云雀助手”的内部试点：只在测试租户开放给 8 名内部用户，
      持续 10 个工作日，阶段记录显示平均处理时间从 11 分钟降到 6 分钟。
      我负责收集反馈、调整提示词和整理上线清单；没有真实客户使用，也没有
      面向全部员工发布。请区分试点阶段结果、个人动作和仍待补证据，并默认
      给出升维迁移。不要泄露内部邮箱、路径或项目代号。
    required_sections:
      - 问题背景
      - 方案决策
      - 个人动作
      - 交付状态
      - 落地范围
      - 效果证据
      - 个人边界
      - 待补证据
      - 面试追问
      - 升维迁移
    optional_outputs:
      - 候选简历表述：仅在用户明确要求求职、简历或表达包装时追加
    expected_behavior:
      - 明确这是有限用户、有限租户和有限周期的内部试点
      - 将处理时间变化标注为阶段记录，不写成生产实测或全面收益
      - 不虚构真实客户、全员覆盖、长期稳定性或最终商业价值
      - 默认提供升维迁移，并保留团队与个人的责任边界

  - id: prototype-with-estimate
    expected: evidence-recap
    delivery_stage: 原型验证
    prompt: |
      请复盘我做的“北辰检索器”本地原型：用 20 条合成样例验证了 17 条，
      没有真实用户、没有线上环境、没有正式监控。我个人完成了数据格式设计、
      检索流程和演示脚本；预计未来可能让人工查找时间减少 30%，但这个收益
      尚未验证。请默认给出升维迁移，并明确哪些是技术验证、哪些只是估算，
      不要把它写成已上线项目或已证实的业务成果。
    required_sections:
      - 问题背景
      - 方案决策
      - 个人动作
      - 交付状态
      - 落地范围
      - 效果证据
      - 个人边界
      - 待补证据
      - 面试追问
      - 升维迁移
    optional_outputs:
      - 候选简历表述：仅在用户明确要求求职、简历或表达包装时追加
    expected_behavior:
      - 明确这是本地原型和技术验证，不是生产落地
      - 将 17/20 标注为合成样例验证结果
      - 将减少 30% 标注为未验证的估算收益
      - 不补写真实用户、线上指标、商业结果或正式上线范围
      - 默认提供事实、机制、影响之间的升维迁移
