# Skill 路由回归用例
#
# 本文件是 ASu-skills 多入口求职工作流的"路由回归数据集"。
#
# 现状声明（重要）：
#   - 当前该数据集**不在 CI 中调用 LLM 判定**。LLM 路由受模型、温度、
#     系统提示等多因素影响，结果不稳定，不适合作为确定性 CI 门禁。
#   - 本文件作为 schema 与 case 的存档，以及后续 Agent Eval 的输入接口：
#     评测脚本可读取本文件，对每条 prompt 调用被测 Agent，断言其选择
#     的 skill 等于 expected 字段，从而把"两个 skill 触发范围重叠"
#     这类回归变成可量化指标。
#
# Schema:
#   cases:
#     - prompt:   <用户输入>
#       expected: <期望命中的 skill 目录名，对应 skills/<name>/>
#       note:     <可选，说明为何应路由到此 skill>
#
# 新增 case 规则：
#   - 每条 case 只对应一个明确的 expected skill；
#   - 边界 case（两个 skill description 都可能匹配）优先收录，用于压测
#     description 的路由区分度；
#   - expected 必须是 skills/ 下实际存在的目录名。

cases:
  - prompt: "帮我酥化这段实习经历"
    expected: asu
    note: 典型经历酥化请求，命中 /asu。

  - prompt: "帮我把 Agent 项目包装一下，顺便写 HR 开场白"
    expected: asu
    note: 包装经历 + HR 话术，原与 asu-resume 重叠的边界，现归 /asu。

  - prompt: "只帮我把项目经历改成简历 bullet 和 HR 开场白"
    expected: asu
    note: 项目经历改写为求职表达，但不要求生成项目导学或面经双文件，归 /asu。

  - prompt: "帮我写一段发给 HR 的自我介绍"
    expected: asu
    note: HR 自我介绍，归 /asu。

  - prompt: "帮我做一份普通后端简历"
    expected: make-resume
    note: 一般简历制作与模板选择，归 /make-resume。

  - prompt: "帮我做一份包含这个项目的可编辑 HTML 简历"
    expected: make-resume
    note: 目标是简历文件交付，归 /make-resume，而不是项目导学。

  - prompt: "我要阿酥同款简历"
    expected: asu-resume
    note: 明确"阿酥同款"，命中 /asu-resume。

  - prompt: "按照阿酥模板复刻并输出 HTML"
    expected: asu-resume
    note: 明确复刻模板 + 生成 HTML，命中 /asu-resume。

  - prompt: "帮我在 GitHub 上找一个容易合并的开源仓库，先做一个小 PR"
    expected: contributor
    note: 典型 first contribution 请求，命中 /contributor。

  - prompt: "目标岗位是后端开发，帮我扫一些开源项目的 typo 和坏链接机会，展示改动方案后我再确认"
    expected: contributor
    note: 展示候选 + 用户确认后提交 PR 的核心流程，命中 /contributor。

  - prompt: "帮我找几个能写进简历的开源小活"
    expected: contributor
    note: 边界 case：同时提到「开源小活」与「写进简历」，contributor 的 description 明确包含「把 PR 写进简历」，归 /contributor 而非 /asu。

  - prompt: "根据我的简历和目标岗位，预测面试官大概率会问什么问题"
    expected: interview
    note: 面试预测请求，命中 /interview。

  - prompt: "检查我简历上的项目经历我自己能不能讲清楚"
    expected: interview
    note: 基于既有简历做掌握度检查，归 /interview，而不是生成导学文件。

  - prompt: "模拟一场压力面，一次只问一个问题，我答得含糊就继续追问"
    expected: interview
    note: 模拟面试 / 压力面 + 连续追问，命中 /interview。

  - prompt: "帮我检查简历上的项目经历我自己能不能讲清楚，讲不透的地方标出来"
    expected: interview
    note: 边界 case：涉及简历内容，但动作是检查掌握程度而非制作简历文件，归 /interview 而非 /make-resume。

  - prompt: "基于这个项目生成导学和面经"
    expected: project-guide
    note: 明确要求项目导学 + 面经双文件，命中 /project-guide。

  - prompt: "帮我分析这个仓库的技术亮点和源码阅读路径"
    expected: project-guide
    note: 源码阅读路径和技术亮点属于项目导学，命中 /project-guide。

  - prompt: "把这个项目整理成能面试复述的 STAR 题库"
    expected: project-guide
    note: 从项目材料生成 STAR 面试题库，命中 /project-guide。

  - prompt: "根据这个 JD 模拟一场 40 分钟技术一面，先别点评，结束后统一复盘"
    expected: interview
    note: 包含面试轮次、时长与延迟反馈策略的契约化模拟，命中 /interview。

  - prompt: "只复练上次没讲清楚的项目指标和个人贡献边界，不要原题重问"
    expected: interview
    note: 基于上一轮缺口的弱项复练，命中 /interview retry。

  - prompt: "面试官问入职两周做一个 Agent demo，我该怎么拆范围、架构和验收"
    expected: interview
    note: 面试中的场景设计题训练，归 /interview 而非通用项目开发。

  - prompt: "把我投递过的公司和当前状态整理成一张求职进度表"
    expected: offer
    note: 典型秋招进度管理请求，命中 /offer。

  - prompt: "这封招聘邮件是说我进入面试了吗？帮我判断证据并更新状态"
    expected: offer
    note: 招聘邮件状态判断，证据不足时标待确认，命中 /offer。

  - prompt: "简历已经定稿开始投递了，帮我记录每家公司的进展和下一步"
    expected: offer
    note: 边界 case：提到简历定稿，但动作是记录投递进展，归 /offer 而非 /make-resume。

  - prompt: "请打开这个招聘链接，用我的简历填写申请表，先不要提交"
    expected: job-apply
    note: 典型浏览器填写求职申请请求，命中 /job-apply。

  - prompt: "帮我把当前网页的姓名、教育经历和项目经历填好，最后停在提交前"
    expected: job-apply
    note: 明确要求操作当前网页并停在提交前，归 /job-apply 而非 /offer。
