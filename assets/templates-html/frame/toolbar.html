<div class="resume-toolbar" role="toolbar" aria-label="简历工具" contenteditable="false">
  <span class="toolbar-title">HTML 简历</span>
  <button type="button" data-action="edit">编辑</button>
  <label class="toolbar-control">字体<select data-action="font" aria-label="字体"><option value="Microsoft YaHei">微软雅黑</option><option value="SimSun">宋体</option><option value="SimHei">黑体</option><option value="Arial">Arial</option><option value="Georgia">Georgia</option><optgroup label="本地字体" data-local-font-group></optgroup></select></label>
  <button type="button" data-action="local-fonts" title="读取系统中已安装的字体（需浏览器授权）">本地字体</button>
  <button type="button" data-action="import-font" title="导入本地字体文件（TTF / OTF / WOFF / WOFF2）">导入字体</button>
  <input type="file" accept=".ttf,.otf,.ttc,.woff,.woff2" multiple data-font-file-input hidden>
  <label class="toolbar-control color-control">文字颜色<input type="color" data-action="color" value="#20252b" aria-label="文字颜色"></label>
  <button type="button" data-action="bold" title="对选中文字加粗或取消加粗"><strong>B</strong> 加粗</button>
  <button type="button" data-action="photo">替换照片</button>
  <button type="button" data-action="pdf">导出 PDF</button>
  <input type="file" accept="image/*" data-photo-input hidden>
</div>
