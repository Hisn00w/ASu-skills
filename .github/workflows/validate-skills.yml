name: validate-skills

on:
  pull_request:
    paths:
      - 'skills/**'
      - '.codex-plugin/**'
      - 'assets/templates-html/**'
      - 'scripts/inline-template.mjs'
      - 'scripts/export-resume-pdf.mjs'
      - 'lib/**'
      - 'scripts/validate_skills.py'
      - 'scripts/validate_skill_routing.py'
      - 'tests/skill-routing-cases.yaml'
      - 'tests/test_validate_skill_routing.py'
      - '.github/workflows/validate-skills.yml'
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - '.codex-plugin/**'
      - 'assets/templates-html/**'
      - 'scripts/inline-template.mjs'
      - 'scripts/export-resume-pdf.mjs'
      - 'lib/**'
      - 'scripts/validate_skills.py'
      - 'scripts/validate_skill_routing.py'
      - 'tests/skill-routing-cases.yaml'
      - 'tests/test_validate_skill_routing.py'
      - '.github/workflows/validate-skills.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run skill validator
        run: python3 scripts/validate_skills.py

      - name: Validate skill routing cases
        run: |
          python3 -m unittest discover -s tests -p 'test_validate_skill_routing.py'
          python3 scripts/validate_skill_routing.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Check JavaScript syntax
        run: |
          node --check lib/index.js
          node --check scripts/inline-template.mjs
          node --check scripts/export-resume-pdf.mjs

      - name: Build all resume templates
        run: node scripts/inline-template.mjs --all "$RUNNER_TEMP/templates"

      - name: Check package contents
        run: npm pack --dry-run
